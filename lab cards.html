<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<style>


     .card{
        width: 200px;
        height: 200px;
        border: 2px solid black;
        margin: 10px;
        display: inline-block;
        border-radius: 5px;
        box-shadow: 0 4px 8px black;
        transition: 2s;
    }
    .desc{
        padding: 0 2px 0 2px;
    }
    img{
        width: 100px;
        border-radius: 5px 5px 0 0; 
         }

             .card:hover{
        box-shadow: 0 8px 16px goldenrod;
    } 

        </style>

 
<body>
         <div class="card">
        <img src="image.png" alt="women" width="100" height="100">
        <div class="desc">
            <h3>fatima</h3>
            <p>software engineer</p>
        </div>
     </div>

    
     <div class="card">
        <img src="hamid.jpeg" alt="man" width="100" height="100">
        <div class="desc">
            <h3>hamid mir</h3>
            <p>generalist</p>
        </div>
     </div>


          <div class="card">
        <img src="sk.jpeg" alt="man" width="100" height="100">

        </div>
     </div>


    
</body>
</html>
