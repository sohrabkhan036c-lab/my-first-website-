<style>
    input[type="radio"]:checked+label{
        color: red;
        font-weight: bold;
    }
    input:hover{
        background-color: black;
        color: white;
        
    }
    input:active{
        background-color: blue;
        color: red;
    }
    /* applied down bg and c onwhole option in select */
    select:nth-of-type(2){

    }
    /*its on select 1*/
    select:nth-of-type(1){

        color: darkmagenta;
    }
    /*this color proper applied on the first option of select 2.this is pseudo class*/
    select option:first-child{

    }

</style>
