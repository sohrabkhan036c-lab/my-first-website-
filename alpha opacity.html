<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    /*alpha use for color how much show color or hide the color its range frome zero to 1
    0 mean hide and 1 mean visible*/
    div{
        width: 200px;
        height: 200px;
        background-color: rgba(0, 255, 0, 0.6);
        /* transition ka mtlb jub div ka coler green se black me change huga to 2 sec lga*/
        transition-duration: 2s;
        /* transition delay ka mtlb he k jub state green se black me change huga 
        tho 1 sec k bad huga,yani jub hum curser lke jynge tho 1 second klye transition
        stop huga per change huna shuro huga*/
        transition-delay: 1s;
    }
    div:hover{
        background-color: black;
        border-radius: 50%;
    }

    #margin{
        width: 200px;
        height: 200px;
        background-color: #4dff00ff;
        margin: 0 auto;
        margin-top: 10px;
        /*eska mtlb he jub div neche ki trf ayega to slowlly ayega ,ese tara yani ease-in jse degr 
        style b de skte he like ease,ease-out etc*/
        transition: margin-top 2s ease-in 0.2s;
    }
    /* margin will be increase from top */
    #margin:hover{
        margin-top: 400px;
        background-color: red;
    }
    /* width will be expand */
    #width:hover{
        background-color: blue;
         width:600px ;
    }
    /*opacity is for element mean to show or hide elements,rang from 0 to 1,if we give opacity
    value zero elements will be hide with color but in alpha just color will be hide not element*/
    #opacity{
        background-color: #ffa511;
         opacity: 1; 
    }
 
    /* section */

    section{
        margin-top: 100px;
    }
    div{
        width: 200px;
        height: 50px;
        border: 2px solid black;
        text-align: center;
        margin:  0 auto;
        background-color: #7aa874;

    }
    div:nth-of-type(2n){
        background-color: #f7db6a;
    }
    div:nth-of-type(3n){
        background-color: #ebb02d;
    }
    /* transformation */
    #one{
        transform: rotate(45deg);
    }
    #two{
        transform: scale(0.5); 
         /* transform: scale(0.5 ,1.5); */
         /* transform: scalex(0.5); */
        /* transform: scaley(0.5); */
    }
    #three{
        /* transform: translate(100px,100px); */
        /* transform: translate(100px); */
        transform: translateX(-100px); 
    }
    #four{
        transform: skew(30deg);
    }
    #five{
        transform: rotate(30deg) translateX(150px);
    }


</style>
