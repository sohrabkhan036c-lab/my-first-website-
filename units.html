<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

<style>
    /* percentage unit use to set any element property according to parrents */
    /* h1 is child ,body is parrent so the width is set fifty$ 
    according to body mean parrent yani k half */
h1{
    border: 2px solid black;
    width:50%;
}
#outer{
    width: 300px;
    height: 300px;
    background-color: pink;
    margin: 10%;

}
/* marging in inner div is according to outer div mean parrent
and margin of outer is according to body mean parrent */
#inner{
    width: 100px;
    height: 100px;
    background-color: brown;
    margin: 5%;
}


/* another 2 dives by default its font size is same,lkn jub mne inner 
font size 2.oem deya tho wo 2 time barra huwa size me */
#out{
    width: 300px;
    height: 300px;
    border: 2px solid black;
    background-color: wheat;
    font-size: 20px;
}

/* padding in inner div set according to font size of inner div 
font size ,padding wil be 40 */
#in{
    width: 100px;
    height: 100px;
    border: 2px solid black;
    background-color: burlywood;
    font-size: 2.0em;
    padding: 1em;
}
/* button ko funt size 50px deya,padding set ki eske mutbk 20 px left and right 
ab agr me font size ko 100px ko barraw tho per padding kam huta he,ess lye padding 
left,right 20px ki bjaye hum left 1em awr right 1em karte he tho padding
font size k mutbk chutta barra huga fix,yani 50px font tho padding bhi 50 hugi both sides */

button{
    font-size: 50px;
    border-radius: 15px;
    border: 5px solid green;
    padding-left: 1em;
    padding-right: 1em;

}
/*draw backs of em if we give div 2 em,then div1 will be twice of section,
div2 will be twice of div1....so its draw back agr 0.5 em de the per opposit huga 
decrese huga size,to solve this problem we use rem unit for to maintain same div sizes 
 0.5rem do tho sub div section k half hunge but 3 div will b same if we give 2rem 
 then 3 div will be double of section*/
section{
    font-size: 15px;
}
div{
    font-size: 2rem;
}
</style>


<body>
